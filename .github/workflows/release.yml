# Builds Lumen Native (native/lumen/, docs/plans/native-rewrite.md) and publishes it on each push to main: the home screen and the same
# program packaged as Lumen Screensaver, Lumen Guide and Lumen Quick Settings (com.samrenfrew.lumen.native, .saver, .guide, .quick).
#  - The version comes from native/lumen/appinfo.json; if that tag exists, the patch number goes up to the next free one. All four apps
#    share it, since they are one program.
#  - It is published as a GitHub release (tag v<version>) and to the Homebrew Channel's stable repository on the hbc-repo branch.
#  - The web Lumen is frozen at 2.2.1 (app/). Its Lumen, Guide and Quick Settings stay listed in the Channel, pointing at the v2.2.1
#    release. Its screensaver side app (com.samrenfrew.lumen.saver) is retired and drops out of the listing.
#  - Branch pushes run nothing: dev builds go to the TV over SSH (npm run deploy:native). GitHub paused this fork's workflows on
#    2026-11-08 for its Actions usage, most of it branch builds nobody downloaded.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
env:
  SDK_RELEASE: 2026.08-webos
  WEBOS_SDK: /home/runner/toolchains/arm-webos-linux-gnueabi_sdk-buildroot
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Version
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess
          a, b, c = (int(x) for x in json.load(open('native/lumen/appinfo.json'))['version'].split('.'))
          tags = set(subprocess.check_output(['git', 'tag', '-l', 'v*'], text=True).split())
          while f'v{a}.{b}.{c}' in tags: c += 1
          version = f'{a}.{b}.{c}'
          for p in glob.glob('native/lumen/appinfo*.json'):
              d = json.load(open(p)); d['version'] = version
              json.dump(d, open(p, 'w'), indent=2)
          open(os.environ['GITHUB_ENV'], 'a').write(f"VERSION={version}\n")
          print(version)
          PY
      - name: webOS SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.WEBOS_SDK }}
          key: webos-sdk-${{ env.SDK_RELEASE }}
      - name: Download the webOS SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$WEBOS_SDK")"
          curl -fsSL "https://github.com/openlgtv/buildroot-nc4/releases/download/$SDK_RELEASE/arm-webos-linux-gnueabi_sdk-buildroot-x86_64.tar.gz" | tar -xz -C "$(dirname "$WEBOS_SDK")"
          "$WEBOS_SDK/relocate-sdk.sh"
      - name: Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            native/lumen/build/target
          key: cargo-${{ hashFiles('native/lumen/Cargo.lock', 'native/lumen/rust-toolchain.toml') }}
      - name: Build the .ipk files
        env:
          LUMEN_PRIVATE: '0'
          LUMEN_DEV: '0'
          LUMEN_BUILD_DIR: ${{ github.workspace }}/release
        run: sh tools/build_native.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPKS=$(ls release/com.samrenfrew.lumen.native*_"$VERSION"_arm.ipk | grep -v native.overlay_)
          {
            printf 'Built from %s.\n\nInstall: from the Homebrew Channel (see the README), or drop each .ipk onto Dev Manager, or `ares-install --device lgtv <file>`. The side apps can also be turned on in Lumen Native, Settings > Side apps.\n\n' "$GITHUB_SHA"
            for f in $IPKS; do printf 'SHA-256 of %s: `%s`\n\n' "$(basename "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"; done
          } > notes.md
          gh release create "v$VERSION" $IPKS --target "$GITHUB_SHA" --title "Lumen Native $VERSION (${GITHUB_SHA:0:7})" --notes-file notes.md
      - name: Homebrew Channel repository
        # The Channel reads the index with XHR, so it is served from raw.githubusercontent.com (CORS allowed) on the hbc-repo branch:
        #   https://raw.githubusercontent.com/<repo>/hbc-repo/stable/apps.json
        run: |
          BASE="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/hbc-repo/stable"
          DL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          PKG=native/lumen/build
          set --
          for P in pkg:native pkg-saver:native.saver pkg-guide:native.guide pkg-quick:native.quick; do
            IPK="release/com.samrenfrew.lumen.${P#*:}_${VERSION}_arm.ipk"
            set -- "$@" "$IPK" "$DL/$(basename "$IPK")" "$PKG/${P%%:*}"
          done
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git fetch origin hbc-repo && git worktree add hbc origin/hbc-repo
          cp -r hbc/stable old-stable && rm -rf hbc/stable
          python3 tools/gen_hbc_repo.py --keep old-stable com.samrenfrew.lumen,com.samrenfrew.lumen.guide,com.samrenfrew.lumen.quick "$BASE" hbc/stable "$@"
          cd hbc && git add -A && git commit -qm "stable: v$VERSION ${GITHUB_SHA:0:7}" && git push origin HEAD:hbc-repo
